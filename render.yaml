services:
  # Loop & Love — Backend Express API Service
  - type: web
    name: loop-and-love-api
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: loop-and-love-db
          property: connectionString
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

databases:
  # Loop & Love — PostgreSQL Relational Database
  - name: loop-and-love-db
    plan: free
    databaseName: loopandlove
    user: loopadmin

